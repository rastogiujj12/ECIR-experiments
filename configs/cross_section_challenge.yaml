project:
  seed: 42
paths:
  processed_dir: data/processed
  profile_dir: data/profiles
  subset_dir: data/subsets_cross_section_challenge
  retrieval_unit_dir: data/retrieval_units_cross_section_challenge
  encoding_dir: outputs/cross_section_challenge/encodings
  ranking_dir: outputs/cross_section_challenge/rankings
  evaluation_dir: outputs/cross_section_challenge/evaluation
  analysis_dir: outputs/cross_section_challenge/analysis
  hf_cache_dir: cache/huggingface
dataset:
  repo_id: allenai/qasper
  subset: qasper
  splits:
  - train
  - validation
  - test
  parquet_files:
    train: https://huggingface.co/datasets/allenai/qasper/resolve/refs%2Fconvert%2Fparquet/qasper/train/0000.parquet
    validation: https://huggingface.co/datasets/allenai/qasper/resolve/refs%2Fconvert%2Fparquet/qasper/validation/0000.parquet
    test: https://huggingface.co/datasets/allenai/qasper/resolve/refs%2Fconvert%2Fparquet/qasper/test/0000.parquet
document:
  include_title: true
  include_abstract: true
  abstract_heading: Abstract
  hierarchy_separator: ' ::: '
  heading_separator: '


    '
  paragraph_separator: '


    '
  section_separator: '


    '
  remove_reference_sections: true
  reference_headings:
  - references
  - bibliography
  - works cited
  - reference
chunking:
  canonical_tokenizer: ibm-granite/granite-embedding-311m-multilingual-r2
  tokenizer_trust_remote_code: false
  chunk_size_tokens: 512
  supported_chunk_sizes:
  - 128
  - 256
  - 512
  overlap_tokens: 0
  retain_short_final_chunk: true
models:
  granite:
    model_id: ibm-granite/granite-embedding-311m-multilingual-r2
    tokenizer_trust_remote_code: false
    max_document_tokens: 32768
  jina:
    model_id: jinaai/jina-embeddings-v3-hf
    tokenizer_trust_remote_code: false
    model_trust_remote_code: false
    max_document_tokens: 8192
    passage_adapter: retrieval_passage
    query_adapter: retrieval_query
sampling:
  core_documents: 150
  granite_extended_documents: 50
  minimum_usable_questions: 1
  length_bins: 3
dense:
  pooling: mean
  normalize: true
  batch_size: 8
  device: cuda
  dtype: float16
  attn_implementation: flex_attention
  output_dtype: float32
bm25:
  lowercase: true
  token_pattern: (?u)\b\w[\w'-]*\b
  k1: 1.5
  b: 0.75
ranking:
  max_depth: 10
  store_complete_ranking: true
evaluation:
  cutoffs:
  - 1
  - 3
  - 5
  - 10
  token_budgets:
  - 512
  - 1024
  - 2048
  - 4096
  primary_metric: ndcg_at_5
  bootstrap_iterations: 10000
  confidence_level: 0.95
  bootstrap_metrics:
  - ndcg_at_5
  - recall_at_5
  - evidence_paragraph_recall_at_5
  - complete_evidence_at_5
  - evidence_paragraph_recall_at_token_budget_1024
  - complete_evidence_at_token_budget_2048
  query_types_filename: query_types.csv
  confirmatory_split: test
  require_query_types: false
  error_analysis_per_direction: 10
