project:
  seed: 42
paths:
  processed_dir: data/qasa/processed
  profile_dir: data/qasa/profiles
  subset_dir: data/qasa/subsets
  retrieval_unit_dir: data/qasa/retrieval_units
  encoding_dir: outputs/qasa/encodings
  ranking_dir: outputs/qasa/rankings
  evaluation_dir: outputs/qasa/evaluation
  analysis_dir: outputs/qasa/analysis
  hf_cache_dir: cache/huggingface

dataset:
  repo_id: lgresearch/QASA
  splits:
  - test
  raw_json_path: data/qasa/raw/testset_answerable_1554_v1.1.json
  qasa_paper_cache_dir: data/qasa/papers
  qasa_request_timeout_seconds: 60

document:
  include_title: true
  include_abstract: true
  abstract_heading: Abstract
  hierarchy_separator: ' ::: '
  heading_separator: "\n\n"
  paragraph_separator: "\n\n"
  section_separator: "\n\n"
  remove_reference_sections: true
  reference_headings:
  - references
  - bibliography
  - works cited
  - reference

chunking:
  canonical_tokenizer: ibm-granite/granite-embedding-311m-multilingual-r2
  tokenizer_trust_remote_code: false
  chunk_size_tokens: 512
  supported_chunk_sizes:
  - 128
  - 256
  - 512
  overlap_tokens: 0
  retain_short_final_chunk: true

models:
  granite:
    model_id: ibm-granite/granite-embedding-311m-multilingual-r2
    tokenizer_trust_remote_code: false
    max_document_tokens: 32768
  jina:
    model_id: jinaai/jina-embeddings-v3-hf
    tokenizer_trust_remote_code: false
    model_trust_remote_code: false
    max_document_tokens: 8192
    passage_adapter: retrieval_passage
    query_adapter: retrieval_query

sampling:
  core_documents: 10000
  granite_extended_documents: 0
  minimum_usable_questions: 1
  length_bins: 3

dense:
  pooling: mean
  normalize: true
  batch_size: 8
  device: cpu
  dtype: float32
  attn_implementation: auto
  output_dtype: float32

bm25:
  lowercase: true
  token_pattern: (?u)\b\w[\w'-]*\b
  k1: 1.5
  b: 0.75

ranking:
  max_depth: 10
  store_complete_ranking: true

evaluation:
  cutoffs:
  - 1
  - 3
  - 5
  - 10
  token_budgets:
  - 512
  - 1024
  - 2048
  - 4096
  primary_metric: ndcg_at_5
  bootstrap_iterations: 10000
  confidence_level: 0.95
  bootstrap_metrics:
  - ndcg_at_5
  - recall_at_5
  - evidence_paragraph_recall_at_5
  - complete_evidence_at_5
  - evidence_paragraph_recall_at_token_budget_1024
  - complete_evidence_at_token_budget_2048
  query_types_filename: query_types.csv
  confirmatory_split: test
  require_query_types: false
  error_analysis_per_direction: 10
